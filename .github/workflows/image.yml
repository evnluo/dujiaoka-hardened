name: Test and publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated security test image on native architecture
        run: docker build --target security-test --build-arg VCS_REF=${{ github.sha }} -t dujiaoka-security-test .
      - name: Verify runtime and extension requirements
        run: |
          docker run --rm --network none --entrypoint php dujiaoka-security-test tests/runtime-platform.php
          docker run --rm --network none --entrypoint composer dujiaoka-security-test check-platform-reqs --no-dev
      - name: Run synthetic payment security regressions
        run: docker run --rm --network none dujiaoka-security-test
      - name: Verify real application and admin workflows
        run: |
          docker run --rm --network none --entrypoint php dujiaoka-security-test tests/backend.php
          docker build --target app-test --build-arg VCS_REF=${{ github.sha }} -t dujiaoka-app-test .
          docker run --rm --network none dujiaoka-app-test
      - name: Verify MariaDB transactions and concurrent callbacks
        run: sh tests/run-database.sh dujiaoka-security-test
      - name: Verify concurrent inventory edits and imports
        run: sh tests/run-inventory-database.sh dujiaoka-security-test
      - name: Verify Nginx and PHP access boundaries
        run: sh tests/container-http.sh dujiaoka-security-test
      - name: Verify production entrypoint and storage initialization
        run: sh tests/container-entrypoint.sh dujiaoka-security-test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture image
        env:
          IMAGE: ghcr.io/evnluo/dujiaoka-hardened:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker build --target final --build-arg VCS_REF=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-architecture manifest
        env:
          IMAGE: ghcr.io/evnluo/dujiaoka-hardened:sha-${{ github.sha }}
        run: |
          docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
