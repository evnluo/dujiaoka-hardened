# Existing installation with database/Redis configured in the mounted .env.
# Create the files/directories first; do not mount application source over the image.
services:
  web:
    build:
      context: .
      target: runtime
    image: ghcr.io/evnluo/dujiaoka-hardened:${IMAGE_TAG:?Set IMAGE_TAG to the published sha tag}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR}/dujiaoka/.env:/dujiaoka/.env:ro
      - ${DATA_DIR:?Set DATA_DIR}/dujiaoka/install.lock:/dujiaoka/install.lock
      - ${DATA_DIR:?Set DATA_DIR}/dujiaoka/public/uploads:/dujiaoka/public/uploads
      - ${DATA_DIR:?Set DATA_DIR}/dujiaoka/storage:/dujiaoka/storage
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
